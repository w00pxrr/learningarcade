<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>The Powder Toy</title>
  <link rel="preload" href="powder.wasm" as="fetch" crossorigin>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    var Module = {
      canvas: document.getElementById('canvas'),
      locateFile: function(path) {
        if (path === 'powder.wasm') return 'powder.wasm';
        return path;
      },
      onRuntimeInitialized: function() {
        console.log('Powder Toy ready!');
      }
    };
  </script>

  <script src="powder.js" defer></script>
</body>
</html>
